name: Windows candidate (no publication)

on:
  workflow_dispatch:
    inputs:
      signing:
        type: choice
        description: Candidate is unsigned; signed requires an arranged signing runner and existing keys.
        options: [candidate, signed]
        default: candidate

permissions:
  contents: read

jobs:
  package:
    # Hosted Server builds are not native Windows 11/provider qualification.
    # The signing label is explicitly provisioned by an operator; no runner,
    # certificate or account is created by this workflow.
    runs-on: ${{ inputs.signing == 'signed' && fromJSON('["self-hosted", "Windows", "X64", "colimaui-signing"]') || fromJSON('["windows-2025"]') }}
    environment: windows-candidates
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
          toolset: '14.44'
          sdk: '10.0.26100.0'
      - name: Build unsigned candidate
        if: inputs.signing == 'candidate'
        run: npm run build:windows
      - name: Build signed candidate, verify Authenticode
        if: inputs.signing == 'signed'
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:windows:signed
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-${{ inputs.signing }}-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*
            src-tauri/target/x86_64-pc-windows-msvc/release/colima-ui.exe
            tmp/reports/windows-build/build.json
          if-no-files-found: error
          retention-days: 7
