name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== Lint & Type Check (fast — runs first) =====
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - name: Windows foundation boundaries, config, secrets and scoped Rust format
        run: npm run check:windows

      - name: ESLint (dead code / unused / error-prone)
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Svelte check
        run: npm run check

      - name: CSS token gate (a var() nothing defines paints nothing)
        run: npm run check:tokens

      - name: i18n key gate (locales must agree)
        run: npm run check:i18n

      # The suite exists and is fast; without this it was never enforced
      # anywhere — not here, not in the pre-push hook.
      - name: Unit tests (vitest)
        run: npm test

      - name: Build and version tooling contracts
        run: npm run test:tooling

  # ===== Rust Check (all platforms) =====
  rust-check:
    name: Rust Check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-latest
            target: aarch64-apple-darwin
            native: true
          - name: macOS x86
            runner: macos-latest
            target: x86_64-apple-darwin
            native: false
          - name: Linux x86
            runner: ubuntu-latest
            target: ""
            native: true
          - name: Windows MSVC x64 (hosted build, not Windows 11 qualification)
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            native: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Controlled process fixtures share the declared Node prerequisite on
      # Windows/macOS/Linux; the installed application never depends on Node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
          vsversion: '2022'
          toolset: '14.44'
          sdk: '10.0.26100.0'

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets --all-features ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Parse native PowerShell helpers without executing them
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell syntax failed: $($_.Name)" }
          }

      - name: cargo clippy (dead code / unused — errors on any warning)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- -D warnings

      # Native runner only: a cross-compiled target cannot execute its tests.
      # Integration tests that need Docker/Trivy carry #[ignore], so a bare
      # `cargo test` runs the unit tests and skips them.
      - name: cargo test (unit)
        if: matrix.native
        working-directory: src-tauri
        run: cargo test --locked --lib --all-features

      - name: Standalone CLI build
        working-directory: src-tauri
        run: cargo build --locked --features cli --bins ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  # ===== Frontend Build =====
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  dependency-health:
    name: Scoped dependency and license ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: npm ci
      - name: Install declared audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: npm run check:dependencies
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-health
          path: tmp/reports/windows-quality/
          if-no-files-found: error
          retention-days: 7
